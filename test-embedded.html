<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线性代数模块集成测试 - 嵌入模式</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .test-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .test-card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
    }

    .test-card-header h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .test-card-header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .test-card-body {
      padding: 20px;
    }

    .test-container {
      border: 2px dashed #ddd;
      border-radius: 8px;
      min-height: 400px;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      margin: 5px;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-1px);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .status {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }

    .log-panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      padding: 20px;
    }

    .log-panel h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 6px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .log-entry {
      margin-bottom: 5px;
    }

    .log-entry.error {
      color: #f48771;
    }

    .log-entry.success {
      color: #89d185;
    }

    .log-entry.info {
      color: #6cb6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 线性代数模块集成测试 - 嵌入模式</h1>
      <p class="subtitle">测试模块在不同场景下的嵌入集成能力</p>
    </header>

    <div class="test-grid">
      <!-- 测试1: 加载特定可视化 -->
      <div class="test-card">
        <div class="test-card-header">
          <h2>测试 1: 加载特定可视化</h2>
          <p>测试 loadVisualization() 方法</p>
        </div>
        <div class="test-card-body">
          <div class="controls">
            <button onclick="test1Init()">初始化</button>
            <button onclick="test1Load('determinant-2d')" id="test1-btn" disabled>二阶行列式</button>
            <button onclick="test1Load('eigenvalue')" id="test1-btn2" disabled>特征值</button>
            <button onclick="test1Clear()" disabled id="test1-clear">清空</button>
          </div>
          <div id="test1-status"></div>
          <div id="test1-container" class="test-container">
            等待初始化...
          </div>
        </div>
      </div>

      <!-- 测试2: 嵌入式视图 -->
      <div class="test-card">
        <div class="test-card-header">
          <h2>测试 2: 嵌入式视图</h2>
          <p>测试 createEmbeddedView() 方法</p>
        </div>
        <div class="test-card-body">
          <div class="controls">
            <button onclick="test2Init()">初始化</button>
            <button onclick="test2ShowList()" id="test2-btn" disabled>显示列表</button>
            <button onclick="test2ShowChapter(5)" id="test2-btn2" disabled>第五章</button>
            <button onclick="test2Clear()" disabled id="test2-clear">清空</button>
          </div>
          <div id="test2-status"></div>
          <div id="test2-container" class="test-container">
            等待初始化...
          </div>
        </div>
      </div>

      <!-- 测试3: 主题切换 -->
      <div class="test-card">
        <div class="test-card-header">
          <h2>测试 3: 主题切换</h2>
          <p>测试 setTheme() 方法</p>
        </div>
        <div class="test-card-body">
          <div class="controls">
            <button onclick="test3Init()">初始化</button>
            <button onclick="test3Theme('default')" id="test3-btn" disabled>默认主题</button>
            <button onclick="test3Theme('dark')" id="test3-btn2" disabled>暗色主题</button>
          </div>
          <div id="test3-status"></div>
          <div id="test3-container" class="test-container">
            等待初始化...
          </div>
        </div>
      </div>

      <!-- 测试4: API 方法 -->
      <div class="test-card">
        <div class="test-card-header">
          <h2>测试 4: API 方法</h2>
          <p>测试各种 API 方法</p>
        </div>
        <div class="test-card-body">
          <div class="controls">
            <button onclick="test4Init()">初始化</button>
            <button onclick="test4GetList()" id="test4-btn" disabled>获取列表</button>
            <button onclick="test4Search()" id="test4-btn2" disabled>搜索概念</button>
            <button onclick="test4Stats()" id="test4-btn3" disabled>统计信息</button>
          </div>
          <div id="test4-status"></div>
          <div id="test4-container" class="test-container">
            等待初始化...
          </div>
        </div>
      </div>
    </div>

    <!-- 日志面板 -->
    <div class="log-panel">
      <h3>📋 测试日志</h3>
      <div class="log" id="log"></div>
    </div>
  </div>

  <!-- 引入模块文件 -->
  <script src="./module.config.js"></script>
  <script src="./linear-algebra-loader.js"></script>
  <script src="./linear-algebra-api.js"></script>

  <script>
    const testStates = {
      test1: false,
      test2: false,
      test3: false,
      test4: false
    };

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function showStatus(testId, message, type = 'info') {
      const statusDiv = document.getElementById(`${testId}-status`);
      statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
    }

    // 测试1: 加载特定可视化
    async function test1Init() {
      log('测试1: 开始初始化...');
      showStatus('test1', '正在初始化...', 'info');

      try {
        const result = await LinearAlgebra.init({
          basePath: './',
          theme: 'default'
        });

        if (result.success) {
          testStates.test1 = true;
          document.getElementById('test1-btn').disabled = false;
          document.getElementById('test1-btn2').disabled = false;
          document.getElementById('test1-clear').disabled = false;
          log('测试1: 初始化成功', 'success');
          showStatus('test1', '✓ 初始化成功，可以加载可视化', 'success');
          document.getElementById('test1-container').innerHTML = '<p style="color: #999;">点击按钮加载可视化</p>';
        }
      } catch (error) {
        log(`测试1: 初始化失败 - ${error.message}`, 'error');
        showStatus('test1', `✗ 初始化失败: ${error.message}`, 'error');
      }
    }

    async function test1Load(vizId) {
      log(`测试1: 加载可视化 ${vizId}`);
      showStatus('test1', `正在加载 ${vizId}...`, 'info');

      try {
        await LinearAlgebra.loadVisualization(vizId, '#test1-container');
        log(`测试1: ${vizId} 加载成功`, 'success');
        showStatus('test1', `✓ ${vizId} 加载成功`, 'success');
      } catch (error) {
        log(`测试1: 加载失败 - ${error.message}`, 'error');
        showStatus('test1', `✗ 加载失败: ${error.message}`, 'error');
      }
    }

    function test1Clear() {
      document.getElementById('test1-container').innerHTML = '<p style="color: #999;">已清空</p>';
      log('测试1: 容器已清空');
      showStatus('test1', '✓ 容器已清空', 'success');
    }

    // 测试2: 嵌入式视图
    async function test2Init() {
      log('测试2: 开始初始化...');
      showStatus('test2', '正在初始化...', 'info');

      try {
        const result = await LinearAlgebra.init({
          basePath: './',
          theme: 'default'
        });

        if (result.success) {
          testStates.test2 = true;
          document.getElementById('test2-btn').disabled = false;
          document.getElementById('test2-btn2').disabled = false;
          document.getElementById('test2-clear').disabled = false;
          log('测试2: 初始化成功', 'success');
          showStatus('test2', '✓ 初始化成功', 'success');
          document.getElementById('test2-container').innerHTML = '<p style="color: #999;">点击按钮显示内容</p>';
        }
      } catch (error) {
        log(`测试2: 初始化失败 - ${error.message}`, 'error');
        showStatus('test2', `✗ 初始化失败: ${error.message}`, 'error');
      }
    }

    async function test2ShowList() {
      log('测试2: 显示可视化列表');
      showStatus('test2', '正在加载列表...', 'info');

      try {
        await LinearAlgebra.createEmbeddedView('#test2-container', {
          width: '100%',
          height: '400px'
        });
        log('测试2: 列表显示成功', 'success');
        showStatus('test2', '✓ 列表显示成功', 'success');
      } catch (error) {
        log(`测试2: 显示失败 - ${error.message}`, 'error');
        showStatus('test2', `✗ 显示失败: ${error.message}`, 'error');
      }
    }

    async function test2ShowChapter(chapter) {
      log(`测试2: 显示第${chapter}章内容`);
      showStatus('test2', `正在加载第${chapter}章...`, 'info');

      try {
        await LinearAlgebra.createEmbeddedView('#test2-container', {
          width: '100%',
          height: '400px',
          filters: { chapter: chapter }
        });
        log(`测试2: 第${chapter}章显示成功`, 'success');
        showStatus('test2', `✓ 第${chapter}章显示成功`, 'success');
      } catch (error) {
        log(`测试2: 显示失败 - ${error.message}`, 'error');
        showStatus('test2', `✗ 显示失败: ${error.message}`, 'error');
      }
    }

    function test2Clear() {
      document.getElementById('test2-container').innerHTML = '<p style="color: #999;">已清空</p>';
      log('测试2: 容器已清空');
      showStatus('test2', '✓ 容器已清空', 'success');
    }

    // 测试3: 主题切换
    async function test3Init() {
      log('测试3: 开始初始化...');
      showStatus('test3', '正在初始化...', 'info');

      try {
        const result = await LinearAlgebra.init({
          basePath: './',
          theme: 'default'
        });

        if (result.success) {
          testStates.test3 = true;
          document.getElementById('test3-btn').disabled = false;
          document.getElementById('test3-btn2').disabled = false;
          log('测试3: 初始化成功', 'success');
          showStatus('test3', '✓ 初始化成功', 'success');

          // 加载一个可视化用于测试主题
          await LinearAlgebra.loadVisualization('vector-projection', '#test3-container');
          log('测试3: 加载测试可视化', 'success');
        }
      } catch (error) {
        log(`测试3: 初始化失败 - ${error.message}`, 'error');
        showStatus('test3', `✗ 初始化失败: ${error.message}`, 'error');
      }
    }

    function test3Theme(theme) {
      log(`测试3: 切换到 ${theme} 主题`);
      showStatus('test3', `正在切换到 ${theme} 主题...`, 'info');

      try {
        LinearAlgebra.setTheme(theme);
        log(`测试3: 主题切换成功`, 'success');
        showStatus('test3', `✓ 已切换到 ${theme} 主题`, 'success');
      } catch (error) {
        log(`测试3: 主题切换失败 - ${error.message}`, 'error');
        showStatus('test3', `✗ 切换失败: ${error.message}`, 'error');
      }
    }

    // 测试4: API 方法
    async function test4Init() {
      log('测试4: 开始初始化...');
      showStatus('test4', '正在初始化...', 'info');

      try {
        const result = await LinearAlgebra.init({
          basePath: './',
          theme: 'default',
          enableDatabase: true
        });

        if (result.success) {
          testStates.test4 = true;
          document.getElementById('test4-btn').disabled = false;
          document.getElementById('test4-btn2').disabled = false;
          document.getElementById('test4-btn3').disabled = false;
          log('测试4: 初始化成功', 'success');
          showStatus('test4', '✓ 初始化成功', 'success');
          document.getElementById('test4-container').innerHTML = '<p style="color: #999;">点击按钮测试 API</p>';
        }
      } catch (error) {
        log(`测试4: 初始化失败 - ${error.message}`, 'error');
        showStatus('test4', `✗ 初始化失败: ${error.message}`, 'error');
      }
    }

    function test4GetList() {
      log('测试4: 获取可视化列表');
      showStatus('test4', '正在获取列表...', 'info');

      try {
        const list = LinearAlgebra.getVisualizationList();
        const html = `
          <div style="padding: 20px; text-align: left;">
            <h4>可视化列表 (共 ${list.length} 个)</h4>
            <ul style="margin-top: 10px; font-size: 13px;">
              ${list.slice(0, 5).map(v => `<li>${v.name} (${v.id})</li>`).join('')}
              ${list.length > 5 ? '<li>...</li>' : ''}
            </ul>
          </div>
        `;
        document.getElementById('test4-container').innerHTML = html;
        log(`测试4: 获取到 ${list.length} 个可视化`, 'success');
        showStatus('test4', `✓ 获取成功，共 ${list.length} 个`, 'success');
      } catch (error) {
        log(`测试4: 获取失败 - ${error.message}`, 'error');
        showStatus('test4', `✗ 获取失败: ${error.message}`, 'error');
      }
    }

    function test4Search() {
      log('测试4: 搜索概念');
      showStatus('test4', '正在搜索...', 'info');

      try {
        const results = LinearAlgebra.getVisualizationList({ keyword: '矩阵' });
        const html = `
          <div style="padding: 20px; text-align: left;">
            <h4>搜索 "矩阵" (共 ${results.length} 个结果)</h4>
            <ul style="margin-top: 10px; font-size: 13px;">
              ${results.map(v => `<li>${v.name}</li>`).join('')}
            </ul>
          </div>
        `;
        document.getElementById('test4-container').innerHTML = html;
        log(`测试4: 搜索到 ${results.length} 个结果`, 'success');
        showStatus('test4', `✓ 搜索成功，找到 ${results.length} 个`, 'success');
      } catch (error) {
        log(`测试4: 搜索失败 - ${error.message}`, 'error');
        showStatus('test4', `✗ 搜索失败: ${error.message}`, 'error');
      }
    }

    function test4Stats() {
      log('测试4: 获取统计信息');
      showStatus('test4', '正在获取统计...', 'info');

      try {
        const config = LinearAlgebra.getConfig();
        const version = LinearAlgebra.getVersion();
        const list = LinearAlgebra.getVisualizationList();

        const html = `
          <div style="padding: 20px; text-align: left;">
            <h4>模块统计信息</h4>
            <ul style="margin-top: 10px; font-size: 13px;">
              <li>版本: ${version}</li>
              <li>可视化数量: ${list.length}</li>
              <li>主题: ${Object.keys(config.theme).join(', ')}</li>
              <li>集成模式: ${Object.keys(config.integration).join(', ')}</li>
            </ul>
          </div>
        `;
        document.getElementById('test4-container').innerHTML = html;
        log('测试4: 统计信息获取成功', 'success');
        showStatus('test4', '✓ 统计信息获取成功', 'success');
      } catch (error) {
        log(`测试4: 获取失败 - ${error.message}`, 'error');
        showStatus('test4', `✗ 获取失败: ${error.message}`, 'error');
      }
    }

    // 页面加载完成
    window.addEventListener('DOMContentLoaded', () => {
      log('=== 嵌入模式测试页面加载完成 ===', 'info');
      log('准备就绪，可以开始测试各个功能', 'info');
    });
  </script>
</body>
</html>
